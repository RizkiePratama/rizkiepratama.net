---
custom_css:
  - blog
---

<!DOCTYPE html>
<html lang="en">
    {% include head.html %}
    <body id="blog" class="d-flex flex-fill flex-column">
        {% include header.html %}

        <main id="swup" class="transition-fade flex-grow-1">
          <div id="blog-index-page">

            <div class="blog-container pt-3 pt-md-4">

              <!-- Top Bar: Filter Pills (Search Bar Removed) -->
              <div class="blog-top-bar">
                <div class="blog-topic-strip">
                  <a href="/blog/" class="topic-pill {% if page.url == '/blog/' or page.url == '/blog/index.html' %}active{% endif %}">
                    <span>All Articles</span>
                    <span class="topic-count">{{ site.posts | size }}</span>
                  </a>
                  {% for tag in site.tags %}
                  <a href="/blog/tags/{{ tag[0] }}" class="topic-pill {% if page.tag-name == tag[0] %}active{% endif %}">
                    <span>{{ tag[0] }}</span>
                    <span class="topic-count">{{ tag[1] | size }}</span>
                  </a>
                  {% endfor %}
                </div>
              </div>

              <!-- Main Articles Content -->
              <div class="pb-5 pt-2">
                {{ content }}
              </div>

            </div>

          </div>
        </main>

        {% include footer.html %}
    </body>
</html>
